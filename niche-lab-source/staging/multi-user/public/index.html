<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Niche Lab · Account staging</title><style>body{max-width:760px;margin:40px auto;padding:20px;font:16px/1.6 system-ui;color:#173f36}input,button{font:inherit;padding:10px;margin:6px 0}label{display:block}input{max-width:95%}section{border:1px solid #ccd9d3;border-radius:12px;padding:20px;margin:20px 0}.hidden{display:none}button{cursor:pointer}table{width:100%;text-align:left}#status{white-space:pre-wrap}</style><h1>Niche Lab account staging</h1><p>This separate staging interface requires a configured account service. Existing production invitations are unchanged.</p><p id="status" role="status"></p><section id="login"><h2>Sign in</h2><form id="loginForm"><label>Email <input id="email" type="email" autocomplete="username" required></label><label>Password <input id="password" type="password" autocomplete="current-password" required></label><button>Sign in</button></form></section><section id="account" class="hidden"><h2>Your account</h2><p id="identity"></p><form id="passwordForm"><label>Set a new password after accepting your invitation <input id="newPassword" type="password" autocomplete="new-password" minlength="12" required></label><button>Set password</button></form><button id="logout">Sign out</button></section><section id="admin" class="hidden"><h2>Manage users</h2><form id="inviteForm"><label>Invite by email <input id="inviteEmail" type="email" required></label><button id="inviteButton">Send invitation</button></form><button id="refresh">Refresh users</button><table><thead><tr><th>Email</th><th>Role</th><th>Status</th><th>Action</th></tr></thead><tbody id="users"></tbody></table></section><script type="module" src="accounts.js"></script></html>
